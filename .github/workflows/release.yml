name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          version="${{ steps.version.outputs.tag }}"
          ldflags="-s -w -X main.version=${version}"
          GOOS=linux GOARCH=amd64 go build -ldflags "$ldflags" -o bin/prism-linux-amd64 ./cmd/prism
          GOOS=linux GOARCH=arm64 go build -ldflags "$ldflags" -o bin/prism-linux-arm64 ./cmd/prism
          GOOS=darwin GOARCH=amd64 go build -ldflags "$ldflags" -o bin/prism-darwin-amd64 ./cmd/prism
          GOOS=darwin GOARCH=arm64 go build -ldflags "$ldflags" -o bin/prism-darwin-arm64 ./cmd/prism
          GOOS=windows GOARCH=amd64 go build -ldflags "$ldflags" -o bin/prism-windows-amd64.exe ./cmd/prism

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            bin/prism-linux-amd64
            bin/prism-linux-arm64
            bin/prism-darwin-amd64
            bin/prism-darwin-arm64
            bin/prism-windows-amd64.exe
